<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Brenda ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 2.5rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 320px;
    }
    .heart {
      font-size: 60px;
      animation: beat 0.8s infinite alternate;
    }
    @keyframes beat {
      to { transform: scale(1.15); }
    }
    h1 { color: #d63384; margin-top: 10px; }
    p { color: #555; line-height: 1.5; }
    button {
      background: #ff4b2b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }
    .mensaje {
      display: none;
      margin-top: 20px;
      color: #d63384;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Para Brenda</h1>
    <p>Hice esta pequeña página solo para recordar lo especial que eres para mí.</p>
    <button onclick="revelar()">Toca aquí ✨</button>
    <p id="extra" class="mensaje">¡Te quiero muchísimo, Brenda! 🥰</p>
  </div>

  <script>
    function revelar() {
      document.getElementById('extra').style.display = 'block';
    }
  </script>
</body>
</html>
